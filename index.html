<style>
/* Layout: one phone frame centred on a quiet ground; screens render inside it from JS and slide like native pushes. */
:root{
  --ground:#ececec; --bg:#ffffff; --fg:#1a1a1a; --muted:#7a7a7a; --block:#eeeeee; --block2:#dedede; --line:#d9d9d9; --scrim:rgba(0,0,0,.35);

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ground:#161616;--bg:#1f1f1f;--fg:#f2f2f2;--muted:#9a9a9a;--block:#2a2a2a;--block2:#3a3a3a;--line:#383838;--scrim:rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{--ground:#161616;--bg:#1f1f1f;--fg:#f2f2f2;--muted:#9a9a9a;--block:#2a2a2a;--block2:#3a3a3a;--line:#383838;--scrim:rgba(0,0,0,.55);color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--fg);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:14px}
*{box-sizing:border-box}
.stage{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;justify-content:center;color:var(--muted);font-size:12px;max-width:640px;width:100%}
.stage b{color:var(--fg);font-weight:500}
.stage .jump{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.stage button{font:inherit;font-size:11px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
/* iPhone 16 / 15 Pro: 393×852 points; shrinks proportionally on short windows */
.phone{position:relative;flex:none;height:min(852px,max(600px,calc(100vh - 110px)));aspect-ratio:393/852;max-width:100%;background:var(--bg);border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.12)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);will-change:transform,opacity}
.screen.enter-push{animation:push .3s cubic-bezier(.2,.7,.2,1)}
.screen.enter-pop{animation:pop .3s cubic-bezier(.2,.7,.2,1)}
.screen.enter-fade{animation:fade .2s ease-out}
@keyframes push{from{transform:translateX(100%)}to{transform:none}}
@keyframes pop{from{transform:translateX(-30%);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.screen{animation:none!important}}
.status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-weight:500;flex:none}
.status span:last-child{color:var(--muted);font-size:10px}
.topbar{height:56px;display:flex;align-items:center;gap:12px;padding:0 12px;flex:none}
.topbar h1{font-size:20px;font-weight:500;margin:0;flex:1;min-width:0}
.icon{width:40px;height:40px;border:0;background:none;color:var(--fg);display:grid;place-items:center;border-radius:50%;cursor:pointer;font:inherit;font-size:22px;flex:none}
.icon:hover{background:var(--block)}
.icon .ham{display:grid;gap:4px}.icon .ham i{display:block;width:20px;height:2px;background:var(--fg)}
.icon .bell{width:18px;height:18px;border:2px solid var(--fg);border-radius:50%}
.icon .star{font-size:20px}
.tb-action{font:inherit;font-size:14px;font-weight:500;color:var(--muted);background:none;border:0;cursor:pointer;padding:0 8px}
.content{flex:1;overflow-y:auto;padding:8px 16px 24px;display:flex;flex-direction:column;gap:16px;min-height:0}

.navbar button.active{color:var(--fg);font-weight:500}
.navbar button.active .pill{background:var(--block2)}.navbar button.active .pill i{opacity:1}

.hero .l{font-size:13px;color:var(--muted)}.hero .v{font-size:40px;font-weight:300;line-height:1.1;font-variant-numeric:tabular-nums}.hero .s{font-size:13px;color:var(--muted);margin-top:4px}
.box{background:var(--block);border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:12px}

.row .chev{color:var(--muted);font-size:20px}
.card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.card.filled{background:var(--block);border-color:transparent}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px}.kv span:first-child{color:var(--muted)}.kv.b span{color:var(--fg);font-weight:500}
.btn{font:inherit;font-weight:500;font-size:15px;border-radius:999px;padding:16px 20px;border:1.5px solid var(--fg);background:var(--fg);color:var(--bg);cursor:pointer;width:100%}
.btn.sec{background:var(--bg);color:var(--fg)}
.btn:disabled{opacity:.35;cursor:default}
.footer{flex:none;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;border-top:1px solid var(--line)}
.footer.plain{border-top:0}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:none}.chips::-webkit-scrollbar{display:none}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{font:inherit;font-size:14px;font-weight:500;padding:10px 12px;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:none;color:var(--muted);white-space:nowrap;cursor:pointer;flex:none}
.tabs button.on{color:var(--fg);border-bottom-color:var(--fg)}
.chips button{font:inherit;font-weight:500;font-size:13px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--fg);white-space:nowrap;cursor:pointer}
.chips button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.segs{display:flex;background:var(--block);border-radius:999px;padding:4px}.segs button{flex:1;font:inherit;font-weight:500;font-size:13px;padding:8px 0;border:0;border-radius:999px;background:none;color:var(--muted);cursor:pointer}.segs button.on{background:var(--bg);color:var(--fg)}
.search{display:flex;align-items:center;gap:10px;background:var(--block);border-radius:999px;padding:12px 16px;color:var(--muted)}.search i{width:14px;height:14px;border:2px solid var(--muted);border-radius:50%}
.status-line{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.status-line i{width:8px;height:8px;border-radius:50%;background:var(--fg)}
.two{display:flex;gap:10px}.two .card{flex:1}.card h4{margin:0;font-size:14px;font-weight:500}.card p{margin:0;color:var(--muted);font-size:12px}
.amount{text-align:center;padding:24px 0 8px}.amount .l{color:var(--muted);font-size:13px}.amount .v{font-size:48px;font-weight:300;font-variant-numeric:tabular-nums;line-height:1.1;min-height:1.1em}.amount .s{color:var(--muted);font-size:12px;margin-top:6px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--block);border-radius:12px;padding:10px}
.keypad button{font:inherit;font-size:22px;font-weight:300;padding:12px 0;border:0;background:none;color:var(--fg);border-radius:8px;cursor:pointer}.keypad button:hover{background:var(--bg)}
.note{color:var(--muted);font-size:12px;line-height:1.45;margin:0}
.spark{display:block;width:100%;height:var(--h,140px);max-width:100%}
.chart{position:relative;margin:0 -16px;padding:0 0 30px;touch-action:pan-y;cursor:crosshair;color:var(--fg);user-select:none}
.chart .tip{position:absolute;top:0;transform:translateX(-50%);background:var(--fg);color:var(--bg);border-radius:8px;padding:6px 10px;font-size:12px;white-space:nowrap;pointer-events:none;display:flex;flex-direction:column;align-items:center;line-height:1.3}

.goalcard{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:none;font:inherit;color:var(--fg);text-align:left;cursor:pointer;width:100%}
.goalcard .hd{display:flex;justify-content:space-between;align-items:center}.goalcard .hd b{font-weight:500;font-size:15px}.goalcard .chev{color:var(--muted);font-size:20px}

.content.home{padding-top:24px}.home-head{display:flex;flex-direction:column;gap:20px;margin-bottom:12px}.home-head .hero .v{margin:6px 0 2px}

.scanframe{position:relative;height:210px;border-radius:14px;background:var(--block);display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;padding:0 48px}.scanframe::before{content:"";position:absolute;inset:28px 24px;border:2px dashed var(--muted);border-radius:10px;opacity:.5}
.thumbs{display:flex;gap:10px}.thumb{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}.thumb.done{color:var(--fg);border-color:var(--fg)}.thumb b{font-weight:500}
.switch{width:44px;height:26px;border-radius:13px;background:var(--block2);padding:3px;flex:none;display:flex}.switch i{width:20px;height:20px;border-radius:50%;background:var(--bg)}.switch.on{background:var(--fg);justify-content:flex-end}
/* capture mode: bare phone, full-length screens, menu clamped to one phone height */
body.capture{background:#fff;padding:0;display:block}body.capture .stage{display:none}
body.capture .phone{width:393px;height:auto;min-height:852px;max-width:none;aspect-ratio:auto;border:0;border-radius:0;box-shadow:none;overflow:visible}
body.capture .screen{position:relative;inset:auto;min-height:852px}body.capture .content{overflow:visible;flex:none}body.capture .hscroll{overflow:hidden}
body.capture .phone:has(.drawer){height:852px;overflow:hidden}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
</style>
</head>
<body>
<div class="stage"><span class="modes" id="modes"><button data-mode="onboarding">Onboarding</button><button data-mode="app">App</button></span><span class="jump" id="jump"></span></div>
<div class="phone" id="phone"></div>

<script>
(function(){
  const phone = document.getElementById('phone');
  // mode: client (signed-in app) · prospect (onboarding, account not open yet) · demo (sample data from the welcome screen)
  const state = { amount: '50000', term: '28 d', side: 'Buy', code: 0, cat: 'All', seg: 'All', mode: 'client', obStep: 1, otp: 0, chk: {}, slide: 0 };
  const fmt = n => '$' + Number(n||0).toLocaleString('en-US');
  const status = () => `<div class="status"><span>9:41</span><span>●●●</span></div>`;
  const topbar = (title, o={}) => `<div class="topbar">
    ${o.back ? `<button class="icon" data-act="back" aria-label="Back">←</button>` : o.close ? `` : `<button class="icon" data-act="menu" aria-label="Menu"><span class="ham"><i></i><i></i><i></i></span></button>`}
    <h1>${title}</h1>
    ${o.action ? `<button class="tb-action" data-act="${o.actionAct||'none'}">${o.action}</button>` : ''}
    ${o.noBell ? '' : `<button class="icon" data-act="notif" aria-label="Notifications"><span class="bell"></span></button>`}
  </div>`;
  const navbar = active => `<nav class="navbar">${['Home','Portfolio','Explore','Activity'].map(l=>`<button class="${l===active?'active':''}" data-tab="${l.toLowerCase()}"><span class="pill"><i></i></span>${l}</button>`).join('')}</nav>`;
  const row = (l1,l2,r1,r2,o={}) => `<button class="row" ${o.act?`data-act="${o.act}"`:''}>${o.icon?'<span class="av"></span>':''}${o.dot!=null?`<span class="sw" style="opacity:${o.dot}"></span>`:''}<span class="t"><b>${l1}</b>${l2?`<small>${l2}</small>`:''}</span>${(r1||r2)?`<span class="r">${r1?`<b>${r1}</b>`:''}${r2?`<small>${r2}</small>`:''}</span>`:''}${o.chev===false?'':'<span class="chev">›</span>'}</button>`;
  const kv = (k,v,b) => `<div class="kv ${b?'b':''}"><span>${k}</span><span>${v}</span></div>`;
  const hero = (l,v,s) => `<div class="hero"><div class="l">${l}</div><div class="v">${v}</div>${s?`<div class="s">${s}</div>`:''}</div>`;
  const segs = (items, on, key) => `<div class="segs">${items.map(i=>`<button class="${i===on?'on':''}" data-seg="${key}:${i}">${i}</button>`).join('')}</div>`;
  // Interactive chart: seeded random walk per range → SVG line + area, scrubbable with a cursor and tooltip.
  const RANGES = { '1D':{days:1,n:48}, '1W':{days:7,n:56}, '1M':{days:30,n:60}, '3M':{days:90,n:72}, '6M':{days:180,n:80}, 'YTD':{days:294,n:80}, '1Y':{days:365,n:90}, 'MAX':{days:1095,n:100} };
  const charts = {};
  const chart = (key, o) => {
    const range = o.range || state.range || '1Y'; const R = RANGES[range] || RANGES['1Y']; const n = R.n, h = o.h || 140, w = 380;
    let s = (o.seed*131 + range.length*17 + range.charCodeAt(0)) % 233280, v = 0, pts = [];
    const rnd = () => { s = (s*9301+49297)%233280; return s/233280; };
    for (let i=0;i<n;i++){ v += (rnd()-0.5+(o.drift||0.03))*(o.vol||1); pts.push(v); }
    const min = Math.min(...pts), max = Math.max(...pts); const span = max-min || 1;
    // map the walk onto real values so the last point is the current figure
    const vals = pts.map(p => o.base * (1 + (p - pts[n-1]) / span * (o.spread||0.12)));
    const end = new Date(2026,9,21,15,0); const dates = vals.map((_,i)=> new Date(end.getTime() - (n-1-i)/(n-1)*R.days*864e5));
    const vmin = Math.min(...vals), vmax = Math.max(...vals), vs = vmax-vmin || 1;
    const x = i => (i/(n-1))*w, y = p => h-10-((p-vmin)/vs)*(h-28);
    const d = vals.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(p).toFixed(1)}`).join(' ');
    const chg = (vals[n-1]-vals[0])/vals[0]*100;
    charts[key] = { vals, dates, fmt:o.fmt, range, w, h, y, n };
    return `<div class="chart" data-chart="${key}" style="--h:${h}px">
      <svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="g${key}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="currentColor" stop-opacity=".16"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs><path class="area" d="${d} L${w} ${h} L0 ${h} Z" fill="url(#g${key})"/><path class="line" d="${d}" fill="none" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke"/><line class="cur" x1="0" x2="0" y1="0" y2="${h}" stroke="currentColor" stroke-width="1" vector-effect="non-scaling-stroke" stroke-dasharray="3 3" opacity="0"/><circle class="dot" cx="${w}" cy="${y(vals[n-1]).toFixed(1)}" r="4" fill="currentColor"/></svg>
      <div class="tip" hidden><b></b><small></small></div>
      <div class="chg ${chg<0?'neg':''}">${chg>=0?'+':''}${chg.toFixed(2)}% <small>${range}</small></div>
    </div>`;
  };
  const money = v => '$' + Math.round(v).toLocaleString('en-US');
  // Candlestick chart: seeded OHLC walk ending on the current price. Monochrome: up candles hollow, down candles filled.
  const candles = (key, o) => {
    const range = state.range || '1Y'; const R = RANGES[range] || RANGES['1Y']; const n = Math.min(R.n, 40), h = o.h || 160, w = 380, cw = w/n;
    let s = (o.seed*131 + range.length*17 + range.charCodeAt(0)) % 233280;
    const rnd = () => { s = (s*9301+49297)%233280; return s/233280; };
    const bars = []; let c = 0;
    for (let i=0;i<n;i++){ const op = c + (rnd()-0.5)*0.4; c = op + (rnd()-0.48)*1.6; bars.push({o:op, c, h:Math.max(op,c)+rnd()*0.6, l:Math.min(op,c)-rnd()*0.6}); }
    const shift = c, scale = o.base*0.012;
    bars.forEach(b => { for (const k of ['o','c','h','l']) b[k] = o.base + (b[k]-shift)*scale; });
    const vmin = Math.min(...bars.map(b=>b.l)), vmax = Math.max(...bars.map(b=>b.h)), vs = vmax-vmin || 1;
    const y = p => h-10-((p-vmin)/vs)*(h-28);
    const end = new Date(2026,9,21,15,0); const dates = bars.map((_,i)=> new Date(end.getTime() - (n-1-i)/(n-1)*R.days*864e5));
    const body = bars.map((b,i)=>{ const x = (i+.5)*cw, up = b.c>=b.o, t = y(Math.max(b.o,b.c)), bh = Math.max(1, Math.abs(y(b.o)-y(b.c)));
      return `<line x1="${x}" x2="${x}" y1="${y(b.h).toFixed(1)}" y2="${y(b.l).toFixed(1)}" stroke="currentColor" vector-effect="non-scaling-stroke"/><rect x="${(x-cw*.32).toFixed(1)}" y="${t.toFixed(1)}" width="${(cw*.64).toFixed(1)}" height="${bh.toFixed(1)}" fill="${up?'var(--bg)':'currentColor'}" stroke="currentColor" vector-effect="non-scaling-stroke"/>`; }).join('');
    const chg = (bars[n-1].c-bars[0].o)/bars[0].o*100;
    charts[key] = { vals:bars.map(b=>b.c), bars, dates, fmt:o.fmt, range, w, h, y, n, candle:true };
    return `<div class="chart" data-chart="${key}" style="--h:${h}px">
      <svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">${body}<line class="cur" x1="0" x2="0" y1="0" y2="${h}" stroke="currentColor" stroke-width="1" vector-effect="non-scaling-stroke" stroke-dasharray="3 3" opacity="0"/><circle class="dot" r="0"/></svg>
      <div class="tip" hidden><b></b><small></small></div>
      <div class="chg">${chg>=0?'+':''}${chg.toFixed(2)}% <small>${range}</small></div>
    </div>`;
  };
  const stocks = {
    WALMEX: { name:'Walmart de México', price:62.40, chg:'+$0.74 (1.2%) today', seed:53, stats:[['Open','$61.80'],['Day range','$61.55–62.70'],['Volume','18.4M'],['Market cap','$1.09T'],['P/E','21.4'],['Dividend yield','3.1%'],['52-week range','$54.20–71.90'],['Exchange','BMV']], about:'Mexico’s largest retailer, running Walmart, Bodega Aurrera and Sam’s Club stores across Mexico and Central America.' },
    GFNORTE: { name:'Grupo Financiero Banorte', price:158.10, chg:'+$0.94 (0.6%) today', seed:67, stats:[['Open','$157.20'],['Day range','$156.80–158.90'],['Volume','6.2M'],['Market cap','$456B'],['P/E','8.9'],['Dividend yield','6.4%'],['52-week range','$132.40–174.60'],['Exchange','BMV']], about:'One of Mexico’s largest banking groups, covering retail and corporate banking, insurance and pensions.' },
  };
  const spark = (seed,h) => chart('home'+seed, { seed, h, base:2345600, spread:0.08, fmt:money });
  // Positions double as the allocation: one stacked bar by share, then each category row keyed to its segment's shade.
  const SHADES = [1,.75,.55,.38,.22];
  const positions = [['Funds',33,'3 funds','$780,000','+11.2%'],['Cetes',26,'2 positions','$620,000','+9.9%'],['Pesos',19,'1 deposit','$450,000','+9.6%'],['Stocks',13,'4 tickers','$310,600','−1.3%'],['Dollars',9,'USD 10,000','$185,000','+2.4%']];
  const hbars = items => `<div class="hbars"><div class="stack">${items.map((it,k)=>`<i style="flex:${it[1]};opacity:${SHADES[k]}"></i>`).join('')}</div>
    <div class="list">${items.map((it,k)=>row(it[0],`${it[1]}% · ${it[2]}`,it[3],it[4],{dot:SHADES[k],act:'position'})).join('')}</div></div>`;
  const goals = [['Travel','Moderate strategy','$21,000','$60,000',35],['Emergency fund','Conservative strategy','$48,500','$50,000',97],['New apartment','Growth strategy','$15,000','$400,000',4]];
  const goal = g => `<button class="goal" data-act="none"><span class="hd"><b>${g[0]}</b><span>${g[4]}%</span></span><span class="bar"><i style="width:${g[4]}%"></i></span><small>${g[2]} of ${g[3]} · ${g[1]}</small></button>`;

  const nba = [
    ['Maturing soon','Your Cetes 28d mature 24 Nov','$120,000 rolls into a new 28-day Cetes. Change the term or move it to cash.','Choose','position'],
    ['Idle cash','$65,797 is earning nothing','Pesos 91 days pays 9.95% with a $1,000 minimum.','Invest it','instrument'],
    ['Account','Finish Tier 3 verification','Lifts your deposit limit and unlocks US stocks. Takes about 3 minutes.','Continue','none'],
  ];
  const watch = [['GFNORTE','Stock · BMV','$158.10','+0.6%'],['Finamex Global','Fund · international','$3.1004','+18.2% 1y'],['US dollar','Buy rate','$18.42','−0.3%']];
  const learn = [['Article','How Cetes auctions work','4 min read'],['Video','Funds vs stocks in 90 seconds','1:30'],['Market','Cetes rates rose for a third week','Weekly note · 2 min'],['Guide','Investing in dollars','5 min read']];

  const instruments = [
    ['Cetes 28 days','Cetes · matures 24 Nov','9.85%','rate','Cetes'],
    ['Pesos 91 days','Term deposit · min $1,000','9.95%','rate','Pesos'],
    ['Finamex Liquidez','Fund · daily liquidity','$1.2345','+9.4% 1y','Funds'],
    ['WALMEX','Stock · BMV','$62.40','+1.2%','Stocks'],
    ['US dollar','Dollars · min $1,000','$18.42','buy rate','Dollars'],
    ['Finamex Global','Fund · international','$3.1004','+18.2% 1y','Funds'],
    ['Cetes 91 days','Cetes · matures 26 Jan','9.92%','rate','Cetes'],
    ['GFNORTE','Stock · BMV','$158.10','+0.6%','Stocks'],
  ];

  // Onboarding: eight steps; obStep is the furthest step reached, so Save & exit / Continue resume there
  const OB = ['Create your account','Verify your phone','Scan your ID','Check your details','Work &amp; income','Your investing plans','Your bank account','Review &amp; sign'];
  // three stages so eight steps read as You → Your money → Sign
  const STAGES = [['You',[1,2,3,4]],['Your money',[5,6,7]],['Sign',[8]]];
  const stageOf = n => STAGES.findIndex(st=>st[1].includes(n));
  const stageBar = (upTo, cur) => `<span class="stages">${STAGES.map((st,i)=>`<span class="stg ${i===cur?'cur':''}" style="flex:${st[1].length}"><span class="segbar">${st[1].map(k=>`<i class="${k<=upTo?'on':''}"></i>`).join('')}</span><small>${st[0]}</small></span>`).join('')}</span>`;
  const SLIDES = [['Invest from $100','Government Cetes, funds, stocks and dollars, all in one app.'],['Your money, working in Mexico’s markets','Track every position and goal in one place.'],['Open your account in about 10 minutes','Have your ID, a recent proof of address and your bank CLABE ready.']];
  const obHead = n => `${status()}${topbar('',{back:true,noBell:true,action:'Save &amp; exit',actionAct:'obSave:'+n})}`;
  const obTitle = (n, sub) => `<div class="obprog">${stageBar(n, stageOf(n))}</div><div class="obh"><h2>${OB[n-1]}</h2>${sub?`<p>${sub}</p>`:''}</div>`;
  const obNext = (n, label, ok=true) => `<div class="footer plain"><button class="btn" data-act="obNext:${n}" ${ok?'':'disabled'}>${label||'Continue'}</button></div>`;
  const fld = (label, value, o={}) => `<div class="field"><label>${label}</label><div class="in ${value?'':'ph'}">${value||o.ph||''}${o.select?'<span>⌄</span>':''}${o.tag?`<span class="tag">${o.tag}</span>`:''}</div>${o.hint?`<small>${o.hint}</small>`:''}</div>`;
  const chk = (key, label) => `<button class="chk ${state.chk[key]?'on':''}" data-chk="${key}"><i>${state.chk[key]?'✓':''}</i><span>${label}</span></button>`;
  const opt = (group, label) => `<button class="opt ${state[group]===label?'on':''}" data-opt="${group}:${label}"><i></i>${label}</button>`;

  const screens = {
    welcome: () => `${status()}<div class="content wl">
      <div class="brand">Finamex</div>
      <span class="box">Illustration</span>
      <div><h2>${SLIDES[state.slide][0]}</h2><p>${SLIDES[state.slide][1]}</p></div>
      <div class="dots">${SLIDES.map((_,i)=>`<button class="${i===state.slide?'on':''}" data-slide="${i}" aria-label="Slide ${i+1}"></button>`).join('')}</div>
    </div><div class="footer plain col"><button class="btn" data-act="obStart">Open an account</button><button class="btn sec" data-act="demo">Explore a demo account</button><button class="linkbtn" data-act="signin">I already have an account · Sign in</button><p class="note" style="text-align:center">Privacy notice · Terms &amp; conditions</p></div>`,

    obLocation: () => `${status()}${topbar('',{back:true,noBell:true})}<div class="content">
      <span class="box" style="height:200px">Location illustration</span>
      <div class="obh"><h2>Allow location to continue</h2><p>We confirm you’re in Mexico before opening your account, and each time you sign in.</p></div>
    </div><div class="footer plain col"><button class="btn" data-act="obAllow">Allow location</button><button class="btn sec" data-act="obDeny">Not now</button></div>`,

    obPrep: () => `${status()}${topbar('',{back:true,noBell:true})}<div class="content">
      <div class="obh"><h2>What you’ll need</h2><p>About 10 minutes. You can save and finish later at any point.</p></div>
      <div class="list">${[['Your official ID','INE or passport. We’ll scan it to fill in your details'],['Proof of address','Utility bill or bank statement from the last 3 months'],['Your bank CLABE','18 digits, from an account in your name']].map(r=>row(r[0],r[1],'','',{icon:true,chev:false})).join('')}</div>
      <div class="obprog">${stageBar(0,-1)}</div>
      <p class="note">Three short stages: about you, your money, then sign.</p>
    </div><div class="footer plain"><button class="btn" data-act="obPrepGo">I’m ready</button></div>`,

    obNoLoc: () => `${status()}${topbar('',{back:true,noBell:true})}<div class="content">
      <div class="success"><i></i><b>Location is off</b><span>We can’t open your account without confirming your location. Turn it on in Settings, then try again.</span></div>
      <p class="note" style="text-align:center">Need help? Call 800 000 0000</p>
    </div><div class="footer plain col"><button class="btn" data-act="obAllow">Try again</button><button class="btn sec" data-act="none">Open Settings</button></div>`,

    obOutside: () => `${status()}${topbar('',{back:true,noBell:true})}<div class="content">
      <div class="success"><i></i><b>You need to be in Mexico</b><span>Accounts can only be opened from within Mexico. If you think this is a mistake, give us a call.</span></div>
      <p class="note" style="text-align:center">800 000 0000 · Mon–Fri 8:00–20:00</p>
    </div><div class="footer plain"><button class="btn sec" data-act="obWelcome">Back to start</button></div>`,

    ob1: () => `${obHead(1)}<div class="content">${obTitle(1,'This is how you’ll sign in.')}
      ${fld('Full name','María Fernanda López')}${fld('Email','maria.lopez@email.com')}${fld('Mobile number','+52 55 •••• 4471')}
      ${fld('Username','mflopez',{tag:'Available'})}${fld('Password','••••••••••',{hint:'At least 8 characters with upper and lower case, a number and a symbol'})}
      ${fld('Promo code (optional)','',{ph:'Enter a code'})}
      ${chk('terms','I accept the Privacy Notice and the Terms &amp; Conditions')}
    </div>${obNext(1,'Continue',!!state.chk.terms)}`,

    ob2: () => `${obHead(2)}<div class="content">${obTitle(2,'Enter the 5-digit code we sent to +52 55 •••• 4471.')}
      <div class="code">${[0,1,2,3,4].map(i=>`<i class="${i<state.otp?'on':''}">${i<state.otp?'•':''}</i>`).join('')}</div>
      <p class="note">Resend in 0:42 · Send by email instead · Change number</p>
      <div class="keypad">${['1','2','3','4','5','6','7','8','9','','0','⌫'].map(k=>k?`<button data-otp="${k}">${k}</button>`:'<span></span>').join('')}</div>
    </div>${obNext(2,'Verify',state.otp>=5)}`,

    ob3: () => { const sc = state.scan||0, pass = state.idType==='Passport';
      // an INE needs front and back; a passport only its photo page
      const sides = pass ? ['Photo page'] : ['Front','Back'], done = sc>=sides.length, next = (sides[sc]||'').toLowerCase();
      return `${obHead(3)}<div class="content">${obTitle(3,'We’ll read your details from it, so there’s less to type.')}
      ${segs(['INE','Passport'],pass?'Passport':'INE','idType')}
      <div class="scanframe"><span>${done?'All set, we’ve read your ID':`Place the ${next} of your ${pass?'passport':'INE'} in the frame`}</span></div>
      <div class="thumbs">${sides.map((x,i)=>`<span class="thumb ${sc>i?'done':''}">${x}<b>${sc>i?'✓':''}</b></span>`).join('')}</div>
      <button class="linkbtn" data-act="obManual">Enter my details by hand instead</button>
    </div><div class="footer plain">${done?`<button class="btn" data-act="obNext:3">Continue</button>`:`<button class="btn" data-act="obScan">Take photo of ${next}</button>`}</div>`; },

    ob4: () => { const id = state.manual ? {} : {tag:'From your ID'};
      return `${obHead(4)}<div class="content">${obTitle(4, state.manual?'As they appear on your official ID.':'We read these from your ID. Check they’re right.')}
      ${fld('CURP','LOMF900312MDFPRR08',id)}${fld('RFC','LOMF900312AB1',{tag:'From your CURP'})}
      ${fld('Date of birth','12 March 1990',id)}${fld('Nationality','Mexican',{select:true})}
      <div class="label">Address</div>
      ${fld('Street and number','Av. Insurgentes Sur 1234, Int. 5',id)}<div class="two">${fld('Postcode','03100',id)}${fld('Neighbourhood','Del Valle',{select:true})}</div>${fld('Municipality and state','Benito Juárez, CDMX',{hint:'Filled in from the postcode'})}
      ${state.proof ? `<button class="upload done" data-act="obUpload"><span><b style="font-weight:500">proof-of-address.pdf</b><br><small>1.2 MB · uploaded</small></span><span class="tag">Replace</span></button>`
        : `<button class="upload" data-act="obUpload"><b style="font-weight:500">Upload proof of address</b><small>Utility bill or bank statement under 3 months old · PDF, JPG or PNG</small></button>`}
    </div>${obNext(4,'Continue',!!state.proof)}`; },

    ob5: () => `${obHead(5)}<div class="content">${obTitle(5,'We’re required to ask where your money comes from.')}
      ${fld('Occupation','Employee · private sector',{select:true})}${fld('Main source of income','Salary',{select:true})}${fld('Source of the funds you’ll invest','Savings',{select:true})}
    </div>${obNext(5)}`,

    ob6: () => `${obHead(6)}<div class="content">${obTitle(6,'A rough idea is fine. You can change this later.')}
      <div class="label">How much do you expect to invest?</div>
      <div class="opts">${['Up to $50,000','$50,000 – $250,000','$250,000 – $1,000,000','More than $1,000,000'].map(o=>opt('plan',o)).join('')}</div>
      <div class="label">How often will you deposit or withdraw?</div>
      <div class="opts">${['1–2 times a month','3–5 times a month','More than 5 times a month'].map(o=>opt('freq',o)).join('')}</div>

    const svg = el.querySelector('svg'), rect = svg.getBoundingClientRect();
    const px = Math.max(0, Math.min(rect.width, e.clientX - rect.left));
    // candles snap to the bar under the pointer; lines snap to the nearest point
    const i = c.candle ? Math.min(c.n-1, Math.floor(px/rect.width*c.n)) : Math.round(px/rect.width*(c.n-1));
    const vx = c.candle ? (i+.5)*c.w/c.n : (i/(c.n-1))*c.w, vy = c.y(c.vals[i]);
    const cur = svg.querySelector('.cur'); cur.setAttribute('x1',vx); cur.setAttribute('x2',vx); cur.setAttribute('opacity','.6');
    const dot = svg.querySelector('.dot'); dot.setAttribute('cx',vx); dot.setAttribute('cy',vy.toFixed(1));
    const tip = el.querySelector('.tip'); tip.hidden=false; tip.querySelector('b').textContent = c.fmt(c.vals[i]); tip.querySelector('small').textContent = fmtDate(c.dates[i], c.range) + (c.candle ? ` · O ${c.fmt(c.bars[i].o)} H ${c.fmt(c.bars[i].h)} L ${c.fmt(c.bars[i].l)}` : '');
    const tw = tip.offsetWidth/2; tip.style.left = Math.max(tw, Math.min(rect.width - tw, px)) + 'px';
  }
  function unscrub(e){
    const el = e.target.closest('.chart'); if (!el) return;
    const c = charts[el.dataset.chart]; if (!c) return;
    const svg = el.querySelector('svg'); svg.querySelector('.cur').setAttribute('opacity','0');
    const dot = svg.querySelector('.dot'); dot.setAttribute('cx',c.w); dot.setAttribute('cy',c.y(c.vals[c.n-1]).toFixed(1));
    el.querySelector('.tip').hidden = true;
  }
  phone.addEventListener('pointermove', scrub); phone.addEventListener('pointerdown', scrub);
  phone.addEventListener('pointerleave', unscrub, true); phone.addEventListener('pointerup', unscrub); phone.addEventListener('pointercancel', unscrub);
  document.addEventListener('pointerout', e => { if (e.target.closest && e.target.closest('.chart') && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('.chart'))) unscrub(e); });

  document.addEventListener('click', e => {
    const t = e.target.closest('[data-act],[data-tab],[data-go],[data-cat],[data-term],[data-key],[data-code],[data-seg],[data-mode],[data-ob],[data-otp],[data-chk],[data-opt],[data-slide]');
    if (!t) return;
    if (t.dataset.mode){ if (t.dataset.mode==='app'){ state.mode='client'; go('home'); } else { state.mode='prospect'; go('welcome'); } return; }
    if (t.dataset.ob){ const o=t.dataset.ob; drawer=false;
      if (o==='demo'){ state.mode='demo'; go('home'); return; }
      state.mode='prospect';
      if (o==='prospect'){ state.obStep=Math.max(state.obStep,4); go('prospect'); return; }
      if (o==='welcome'){ go('welcome'); return; }
      stack=['welcome',o]; render('fade'); return; }
    if (t.dataset.otp){ const k=t.dataset.otp; state.otp = k==='⌫' ? Math.max(0,state.otp-1) : Math.min(5,state.otp+1); render(); return; }
    if (t.dataset.chk){ state.chk[t.dataset.chk] = !state.chk[t.dataset.chk]; render(); return; }
    if (t.dataset.opt){ const [g,v]=t.dataset.opt.split(':'); state[g]=v; render(); return; }
    if (t.dataset.slide){ state.slide=Number(t.dataset.slide); render(); return; }
    if (t.dataset.go){ go(t.dataset.go); return; }
    if (t.dataset.tab){ go(t.dataset.tab); return; }
    if (t.dataset.cat){ state.cat = t.dataset.cat; render(); return; }
    if (t.dataset.term){ state.term = t.dataset.term; render(); return; }
    if (t.dataset.seg){ const [k,v]=t.dataset.seg.split(':'); if(k==='side') state.side=v; if(k==='seg') state.seg=v; if(k==='act') state.act=v; if(k==='range') state.range=v; if(k==='ctype') state.ctype=v; if(k==='idType'){ state.idType=v; state.scan=0; } render(); return; }
    if (t.dataset.key){ const k=t.dataset.key; if(k==='⌫') state.amount=state.amount.slice(0,-1); else if(state.amount.length<9) state.amount=(state.amount==='0'?'':state.amount)+k; render(); return; }
    if (t.dataset.code){ const k=t.dataset.code; if(k==='⌫') state.code=Math.max(0,state.code-1); else state.code=Math.min(5,state.code+1); render(); return; }
    const a = t.dataset.act;
    if (a==='back'){ pop(); return; }
    // onboarding
    if (a==='obStart'){ state.mode='prospect'; drawer=false; stack=['welcome','obLocation']; render('push'); return; }
    if (a==='obAllow'){ push('obPrep'); return; }
    if (a==='obPrepGo'){ push('ob1'); return; }
    if (a==='obDeny'){ push('obNoLoc'); return; }
    if (a==='obWelcome'){ go('welcome'); return; }
    if (a.startsWith('obNext:')){ const n=Number(a.split(':')[1]); state.obStep=Math.max(state.obStep, Math.min(OB.length, n+1)); push(n<OB.length ? 'ob'+(n+1) : 'obDone'); return; }
    if (a.startsWith('obSave:')){ state.obStep=Math.max(state.obStep, Number(a.split(':')[1])); go('prospect'); return; }
    if (a.startsWith('obEdit:')){ push('ob'+a.split(':')[1]); return; }
    if (a==='obContinue'){ stack=['prospect','ob'+state.obStep]; render('push'); return; }
    if (a==='obUpload'){ state.proof=true; render(); return; }
    if (a==='obScan'){ state.scan=(state.scan||0)+1; render(); return; }
    if (a==='obManual'){ state.manual=true; state.scan=0; state.obStep=Math.max(state.obStep,4); push('ob4'); return; }
    if (a==='obNotify'){ state.notify=!state.notify; render(); return; }
    if (a==='obFinish'){ state.mode='client'; go('home'); return; }
    if (a==='obFund'){ state.mode='client'; stack=['home','deposit']; render('push'); return; }
    if (a==='demo'){ state.mode='demo'; go('home'); return; }
    if (a==='signin'){ state.mode='client'; go('home'); return; }
    if (a==='locked'){ push('locked'); return; }
    if (state.mode==='prospect' && (a==='deposit' || a==='goals' || a.startsWith('order:'))){ push('locked'); return; }
    if (a==='menu'){ drawer=true; render(); return; }
    if (a==='closeMenu'){ drawer=false; render(); return; }
    if (a==='notif'){ push('notif'); return; }
    if (a==='home'){ state.code=0; go('home'); return; }
    if (a==='instrument'){ push('instrument'); return; }
    if (a==='position'){ push('position'); return; }
    if (a==='deposit'){ push('deposit'); return; }
    if (a==='goals'){ push('goals'); return; }
    if (a.startsWith('stock:')){ state.stock=a.split(':')[1]; push('stock'); return; }
    if (a.startsWith('order:')){ state.side=a.split(':')[1]; state.code=0; push('order'); return; }
    if (a==='review'){ state.code=0; push('review'); return; }
    if (a==='receipt'){ push('receipt'); return; }
    if (a==='copy'){ try{ navigator.clipboard.writeText('002180001234567890').catch(()=>{}); }catch(_){} t.textContent='Copied'; setTimeout(()=>{t.textContent='Copy CLABE';},1200); return; }
  });
  // Deep links for review and Figma capture: ?screen=name.key=value.key=value (chk takes a|b|c), &capture renders a bare 393-wide phone at full length
  const P = new URLSearchParams(location.search), SC = P.get('screen');
  if (P.has('capture')) document.body.classList.add('capture');
  if (SC){ const [name, ...opts] = SC.split('.');
    for (const o of opts){ const [k,v] = o.split('='); if (k==='chk') v.split('|').forEach(c=>state.chk[c]=true); else state[k] = isNaN(v) ? v : Number(v); }
    const onboarding = name==='welcome' || name==='prospect' || name==='locked' || name.startsWith('ob');
    if (!P.get('screen').includes('mode=')) state.mode = onboarding ? 'prospect' : 'client';
    if (state.menu) drawer = true;
    if (screens[name]) stack = name==='home' || name==='welcome' || name==='prospect' ? [name] : [onboarding?'welcome':'home', name];
  }
  if (location.hash.includes('figmacapture')){ const sc = document.createElement('script'); sc.src = 'https://mcp.figma.com/mcp/html-to-design/capture.js'; sc.async = true; document.head.appendChild(sc); }
  render();
})();
</script>
